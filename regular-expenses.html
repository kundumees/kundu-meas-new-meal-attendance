<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Regular Expenses</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>💸 Kundu Mees</h1>

<h2>Regular Expenses Sheet</h2>


<button onclick="location.href='admin.html'">
⬅ Back
</button>


<hr>


<h3>➕ Add Regular Expense</h3>


<label>👤 Member :</label>

<select id="expenseMember">

<option value="">Select Member</option>

<option>Ramu</option>
<option>Nabin</option>
<option>Sovon</option>
<option>Suman</option>
<option>Riman</option>
<option>Dipankar</option>
<option>Krishna</option>
<option>Pradip</option>
<option>Santu</option>
<option>Madhav</option>
<option>Deep</option>
<option>Mohit</option>
<option>Suman 2</option>
<option>Surojit</option>
<option>Bikash</option>
<option>Riju</option>

</select>


<br><br>


<label>📅 Date :</label>

<input type="date" id="expenseDate">


<br><br>


<label>💰 Amount :</label>

<input type="number" id="expenseAmount" placeholder="Enter Expense">


<br><br>


<button id="saveExpense">

💾 Save Expense

</button>


<hr>


<h2>📄 Regular Expense Summary</h2>

<table id="expenseTable">

<thead>

<tr>

<th>📅 Date</th>

<th>👤 Member</th>

<th>💰 Amount</th>

</tr>

</thead>


<tbody id="expenseSummaryBody">

</tbody>


<tfoot>

<tr>

<th colspan="2">
💰 Total Expense
</th>

<th id="expenseGrandTotal">
₹0
</th>

</tr>

</tfoot>


</table>



<br>


<button id="printExpense">

🖨️ Print Expense Summary

</button>



<script type="module" src="regular-expenses.js"></script>


</body>

</html>
