<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Charges</title>

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Arial,sans-serif;
padding:20px;
}

h1,h2{
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:1px solid #000;
padding:8px;
text-align:center;
}

th{
background:#f2f2f2;
}

button{
padding:10px 20px;
margin:10px 5px;
cursor:pointer;
}

</style>

</head>

<body>

<h1>💰 Kundu Mees</h1>

<h2>⚠️ Charges (Admin Only)</h2>

<button onclick="location.href='admin.html'">
⬅ Back
</button>

<hr>

<label><b>📅 Select Month :</b></label>

<input type="month" id="chargeMonth">

<button id="loadCharges">
Load Charges
</button>

<hr>

<h3>➕ Add Charge</h3>

<label>👤 Member :</label>

<select id="member">

<option value="">Select Member</option>

<option>Ramu</option>
<option>Nabin</option>
<option>Sovon</option>
<option>Suman</option>
<option>Riman</option>
<option>Dipankar</option>
<option>Krishna</option>
<option>Pradip</option>
<option>Santu</option>
<option>Madhav</option>
<option>Deep</option>
<option>Mohit</option>
<option>Suman 2</option>
<option>Surojit</option>
<option>Bikash</option>
<option>Riju</option>

</select>

<br><br>

<h3>💰 Fine</h3>

<label>Fine Amount :</label>

<input
type="number"
id="fineAmount"
placeholder="Enter Fine Amount">

<hr>

<h3>⚡ Other Charges</h3>

<label>Charge Type :</label>

<select id="chargeType">

<option value="">Select Charge</option>

<option>Fan Charge</option>

<option>PC Charge</option>

</select>

<br><br>

<label>Amount :</label>

<input
type="number"
id="chargeAmount"
placeholder="Enter Charge Amount">


<br><br>

<button id="saveCharge">

💾 Save Charge

</button>

<hr>

<h2>📋 Charges Ledger</h2>

<table>

<thead>

<tr>

<th>Member</th>

<th>Reason</th>

<th>Amount</th>

</tr>

</thead>

<tbody id="chargesBody">

</tbody>

</table>

<hr>

<h2>📄 Member-wise Charges Summary</h2>

<table>

<thead>

<tr>

<th>Member</th>

<th>Charges</th>

<th>Total</th>

</tr>

</thead>

<tbody id="summaryBody">

</tbody>

<tfoot>

<tr>

<th colspan="2">

💰 Grand Total Charges

</th>

<th id="grandTotal">

₹0

</th>

</tr>

</tfoot>

</table>

<br>

<div style="text-align:center;">

<button onclick="window.print()">

🖨️ Print Charges Report

</button>

</div>

<script>

document.getElementById("chargeMonth").value =
new Date().toISOString().slice(0,7);

</script>

<script type="module" src="charges.js"></script>

</body>

</html>
